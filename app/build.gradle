plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jj.dshpet'
    compileSdk 37

    defaultConfig {
        applicationId "com.jj.dshpet"
        minSdk 26
        targetSdk 37
        versionCode 10000
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.annotation
    compileOnly(libs.libxposed.api)
}

